# SonarQube Cloud configuration (https://sonarcloud.io)
# Scanned by the `sonarqube` job in .github/workflows/ci.yml (requires the SONAR_TOKEN secret).
sonar.projectKey=ventura8_Synology-SRM-Bing-Wallpaper-Auto-update
sonar.organization=ventura8
sonar.projectName=Synology-SRM-Bing-Wallpaper-Auto-update

sonar.sources=bing_wallpaper_auto_update.sh,install.sh,uninstall.sh,tools,.github/workflows
sonar.tests=tests
sonar.exclusions=coverage/**,assets/**,docs/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Line coverage is measured by kcov and gated at >=90% in CI (merged Cobertura report).
# CI converts it to SonarQube generic coverage (tools/cobertura_to_sonar.py) before scanning.
sonar.coverageReportPaths=coverage/sonar-coverage.xml
# Coverage scope is the shipped product scripts; dev tooling and workflows are not runtime code.
sonar.coverage.exclusions=tools/**,.github/**
