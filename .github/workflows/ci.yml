name: "CI Pipeline"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.sh'
      - '**.ps1'
      - '**.py'
      - '**.json'
      - '**.yml'
      - '**.yaml'
      - 'tests/**'
      - 'tools/**'
      - '.editorconfig'
      - '.markdownlint.json'
      - '.pre-commit-config.yaml'
      - '.shellcheckrc'
      - '.yamllint.yml'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install quality dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            python3 \
            python3-pip \
            nodejs \
            npm
          python3 -m pip install --break-system-packages pip==25.2
          python3 -m pip install ruff==0.15.22 yamllint==1.38.0
          sudo npm install --global markdownlint-cli@0.41.0

      - name: Run shell formatter check
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh' '*.bats' | grep -v '^node_modules/' || true)
          if [ "${#shell_files[@]}" -gt 0 ]; then
            docker run --rm -v "$PWD:/mnt" -w /mnt mvdan/shfmt:v3.13.1 \
              -i 4 -ci -d "${shell_files[@]}"
          fi

      - name: Run shell lint
        run: |
          mapfile -t shell_files < <(git ls-files '*.sh' | grep -v '^node_modules/' || true)
          if [ "${#shell_files[@]}" -gt 0 ]; then
            docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
              --severity=style --external-sources "${shell_files[@]}"
          fi

      - name: Run YAML lint
        run: |
          mapfile -t yaml_files < <(git ls-files '*.yml' '*.yaml' | grep -v '^node_modules/' || true)
          if [ "${#yaml_files[@]}" -gt 0 ]; then
            yamllint "${yaml_files[@]}"
          fi

      - name: Run JSON validation
        run: |
          while IFS= read -r file; do
            jq empty "$file" > /dev/null
          done < <(git ls-files '*.json' | grep -v '^node_modules/' || true)

      - name: Run Python lint and format checks
        run: |
          ruff format --check tests/transform_coverage.py tools/*.py
          ruff check tests/transform_coverage.py tools/*.py

      - name: Run Markdown lint
        run: |
          mapfile -t markdown_files < <(git ls-files '*.md' | grep -v '^node_modules/' || true)
          if [ "${#markdown_files[@]}" -gt 0 ]; then
            markdownlint --config .markdownlint.json -- "${markdown_files[@]}"
          fi

      - name: Run non-Markdown line-length check
        run: python3 tools/check_line_length.py

      - name: Run suppression policy check
        run: python3 tools/check_forbidden_suppressions.py

      - name: Run PowerShell lint
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path tools/runners/run_tests.ps1 -Settings tools/config/PSScriptAnalyzerSettings.psd1 -EnableExit

  build-image:
    name: Build & Cache Image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and Cache Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/Dockerfile
          push: false
          load: false
          tags: srm-mock:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Restore Image from Cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: srm-mock:latest
          cache-from: type=gha

      - name: Run Install Tests
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $PWD/coverage:/home/pi/coverage \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/home/pi/coverage \
            srm-mock:latest bash ./tools/runners/run_tests.sh --unit-install

      - name: Run Uninstall Tests
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $PWD/coverage:/home/pi/coverage \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/home/pi/coverage \
            srm-mock:latest bash ./tools/runners/run_tests.sh --unit-uninstall

      - name: Run Wallpaper Tests
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $PWD/coverage:/home/pi/coverage \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/home/pi/coverage \
            srm-mock:latest bash ./tools/runners/run_tests.sh --unit-wallpaper

      - name: Upload Install Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-install
          path: coverage/unit/install/
          include-hidden-files: true

      - name: Upload Uninstall Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-uninstall
          path: coverage/unit/uninstall/
          include-hidden-files: true

      - name: Upload Wallpaper Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-wallpaper
          path: coverage/unit/wallpaper/
          include-hidden-files: true

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Restore Image from Cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: srm-mock:latest
          cache-from: type=gha

      - name: Run Component Tests
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $PWD/coverage:/home/pi/coverage \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/home/pi/coverage \
            srm-mock:latest bash ./tools/runners/run_tests.sh --component-only
      
      - name: Upload Component Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-component
          path: coverage/component/
          include-hidden-files: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Restore Image from Cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: srm-mock:latest
          cache-from: type=gha

      - name: Run E2E Tests
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            -v $PWD/coverage:/home/pi/coverage \
            -e COVERAGE=1 \
            -e COVERAGE_OUTPUT=/home/pi/coverage \
            srm-mock:latest bash ./tools/runners/run_tests.sh --e2e-only

      - name: Upload E2E Coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-e2e
          path: coverage/e2e/
          include-hidden-files: true

  coverage-report:
    name: Merge & Publish Report
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, e2e-tests]
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Restore Image from Cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: srm-mock:latest
          cache-from: type=gha

      - name: Download Install Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-install
          path: coverage_inputs/unit/install

      - name: Download Uninstall Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-uninstall
          path: coverage_inputs/unit/uninstall

      - name: Download Wallpaper Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-wallpaper
          path: coverage_inputs/unit/wallpaper

      - name: Download E2E Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-e2e
          path: coverage_inputs/e2e

      - name: Download Component Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-component
          path: coverage_inputs/component

      - name: Merge Coverage Reports
        run: |
          mkdir -p coverage/final
          chmod 777 coverage/final
          
          # Run kcov --merge inside docker
          docker run --rm \
            --security-opt seccomp=unconfined \
            --cap-add SYS_PTRACE \
            --user root \
            -v $PWD:/app \
            -w /app \
            srm-mock:latest \
            kcov --merge coverage/final \
                 coverage_inputs/unit/install \
                 coverage_inputs/unit/uninstall \
                 coverage_inputs/unit/wallpaper \
                 coverage_inputs/component \
                 coverage_inputs/e2e

          # Standardize path
          mkdir -p coverage/html_report
          FOUND_INDEX=$(find coverage/final -name "index.html" | head -n 1)
          if [ -n "$FOUND_INDEX" ]; then
             echo "Found index at $FOUND_INDEX"
             PARENT_DIR=$(dirname "$FOUND_INDEX")
             cp -r "$PARENT_DIR/"* coverage/html_report/
             echo "Report moved to coverage/html_report/"
          else
             echo "Error: index.html not found in merged output!"
             exit 1
          fi

          # Handle Cobertura XML
          MERGED_XML=$(find coverage/final -name "cobertura.xml" | head -n 1)
          if [ -f "$MERGED_XML" ]; then
             cp "$MERGED_XML" coverage/cobertura.xml
             sed -i 's/branches-covered="\([^"]*\)"/branches-covered="\1" branches-valid="0"/g' coverage/cobertura.xml
          fi

      - name: Validate Coverage
        id: validate_coverage
        run: |
          if [ -f "coverage/cobertura.xml" ]; then
             echo "valid=true" >> $GITHUB_OUTPUT
          else
             echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Append Coverage and Complexity Summary
        if: steps.validate_coverage.outputs.valid == 'true'
        run: |
          python3 tools/coverage_metrics.py \
            --input coverage/cobertura.xml \
            --format markdown \
            --target-per-file 15 \
            --hard-max-per-file 35 \
            --target-avg 10 \
            --hard-max-avg 25 \
            --enforce-complexity \
            --output coverage-metrics-summary.md
          cat coverage-metrics-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-coverage-report
          path: coverage/html_report/

      - name: Restructure Cobertura XML
        if: steps.validate_coverage.outputs.valid == 'true'
        run: |
          python3 tests/transform_coverage.py coverage/cobertura.xml

      - name: Generate Coverage Summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        if: steps.validate_coverage.outputs.valid == 'true'
        with:
          filename: coverage/cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '90 90'

      - name: Write to Job Summary
        if: steps.validate_coverage.outputs.valid == 'true'
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request' && steps.validate_coverage.outputs.valid == 'true'
        with:
          recreate: true
          path: code-coverage-results.md
